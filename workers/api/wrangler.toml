name = "glowdc-integration-api"
account_id = "621f9488fbd5405db3dd538b158092e2"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = true

[[routes]]
pattern = "app.maxio.com.br/glowdc"
zone_name = "maxio.com.br"

[[routes]]
pattern = "app.maxio.com.br/glowdc/*"
zone_name = "maxio.com.br"

[assets]
binding = "ASSETS"
directory = "../../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
APP_ENV = "production"
APP_BASE_PATH = "/glowdc"
PUBLIC_API_BASE_URL = "https://app.maxio.com.br/glowdc"
META_SENDS_ENABLED = "false"
META_GRAPH_VERSION = "SET_EXPLICITLY_BEFORE_DEPLOY"
UAZAPI_ALLOWED_HOSTS = ".uazapi.com"
WEB_APP_ORIGIN = "https://app.maxio.com.br"
RAW_RETENTION_DAYS = "7"
AUDIT_RETENTION_DAYS = "60"

[[d1_databases]]
binding = "DB"
database_name = "glowdc-integration-ops"
database_id = "79af0995-c4ac-4a26-aa82-afcf68fae610"
migrations_dir = "migrations"

[[queues.producers]]
binding = "WHATSAPP_INGEST_QUEUE"
queue = "glowdc-whatsapp-ingest"

[[queues.producers]]
binding = "META_DELIVERY_QUEUE"
queue = "glowdc-meta-delivery"

[[queues.consumers]]
queue = "glowdc-whatsapp-ingest"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "glowdc-whatsapp-ingest-dlq"

[[queues.consumers]]
queue = "glowdc-meta-delivery"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "glowdc-meta-delivery-dlq"

[triggers]
crons = ["17 * * * *"]
