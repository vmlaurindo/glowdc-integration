name = "glowdc-integration-api"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = true

[vars]
APP_ENV = "development"
META_SENDS_ENABLED = "false"
META_GRAPH_VERSION = "SET_EXPLICITLY_BEFORE_DEPLOY"
UAZAPI_ALLOWED_HOSTS = ".uazapi.com"
WEB_APP_ORIGIN = "http://localhost:5173"
RAW_RETENTION_DAYS = "7"
AUDIT_RETENTION_DAYS = "60"

[[d1_databases]]
binding = "DB"
database_name = "glowdc-integration-ops"
database_id = "REPLACE_AFTER_PROVISIONING"
migrations_dir = "migrations"

[[queues.producers]]
binding = "WHATSAPP_INGEST_QUEUE"
queue = "glowdc-whatsapp-ingest"

[[queues.producers]]
binding = "META_DELIVERY_QUEUE"
queue = "glowdc-meta-delivery"

[[queues.consumers]]
queue = "glowdc-whatsapp-ingest"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "glowdc-whatsapp-ingest-dlq"

[[queues.consumers]]
queue = "glowdc-meta-delivery"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "glowdc-meta-delivery-dlq"

[triggers]
crons = ["17 * * * *"]
